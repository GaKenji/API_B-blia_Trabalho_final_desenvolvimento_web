<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="container">

        <h1>Criar Conta</h1>
        <form id="form-cadastro">
            <div class="input-box">
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" placeholder="Digite o seu nome">
            </div>

            <div class="input-box">
                <label for="email">E-mail</label>
                <input type="text" name="email" id="email" placeholder="Digite o seu email">
            </div>

            <div class="input-box">
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha" placeholder="Digite a sua senha">
            </div>

                <button type="submit" class="criarconta">Cadastrar usuário</button>

            <div class="register-link">
                <p>Já possui conta? <a href="login.html">Fazer Login</a></p>
            </div>
        </form>
    </main>

</body>
</html>
